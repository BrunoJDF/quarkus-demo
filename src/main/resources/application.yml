"%dev":
  quarkus:
    rest-client:
      ex-change-client:
        url: https://v6.exchangerate-api.com
        api-key: ${EXCHANGE_API_KEY:3f9d0e67d462c70ce2297172}
        connect-timeout: 5000 # 5 segundos para establecer la conexion
        read-timeout: 10000 # 10 segundos para leer la respuesta
        scope: jakarta.inject.Singleton # Nivel de logging para el cliente REST
    log:
      level: INFO
      console:
        format: "%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n"
      category:
        "org.bruno.product":
          level: DEBUG # Logs de tu aplicación
        "org.bruno.product.infrastructure.client":
          level: DEBUG # Logs del REST client
        "io.quarkus.rest.client":
          level: DEBUG # Logs internos del REST client
        "org.jboss.resteasy.reactive.client":
          level:
          # Debugging detallado (request/response)
    datasource:
      db-kind: postgresql
      username: root
      password: pwd
      jdbc:
        url: jdbc:postgresql://localhost:5434/shopping-cart
      reactive:
        url: postgresql://localhost:5434/shopping-cart
    hibernate-orm:
      log:
        sql: false
      database:
        default-schema: shopping_cart
